name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  # ── Dashboard + Backend via Coolify Webhook ──────────────────
  deploy:
    name: Deploy → Coolify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Coolify Deploy-Webhook auslösen
        run: |
          curl -s -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            --fail || echo "Coolify Webhook fehlgeschlagen"

# ── Secrets die in GitHub gesetzt werden müssen ──────────────
# Repository → Settings → Secrets and variables → Actions
#
# Vite Build:
#   VITE_API_URL, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
#
# Coolify:
#   COOLIFY_WEBHOOK_URL, COOLIFY_TOKEN
